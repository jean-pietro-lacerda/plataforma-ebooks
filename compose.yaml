services:
  frontend:
    build:
      context: ./frontend

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - .:/workspace
      - /workspace/frontend/node_modules
      
  backend:
    build:
      context: ./backend

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

    volumes:
      - ./backend:/app
      - .:/workspace